# Configuration for `cargo deny check`. Only values that differ from the defaults are listed.

[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    # nucleo-matcher (the fuzzy picker): file-level copyleft that applies to its own files
    # only, compatible with RuDo's GPL-3.0-or-later
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
unused-allowed-license = "allow"
# The copyleft license of RuDo itself, which no dependency may bring in unnoticed
exceptions = [{ crate = "rudo-tui", allow = ["GPL-3.0-or-later"] }]

[bans]
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
