name: Packaging

# Builds the recipes of packaging/ that can be built before a release: the PKGBUILD from a
# source archive of the commit, the .deb and .rpm of Cargo.toml, and the Nix flake, and installs
# the packages in containers of their distributions, and checks that the package versions of
# pre-releases sort before their release. docs/PACKAGING.md describes the recipes.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch:
    name: makepkg and namcap on Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      # git first, so that the checkout is a repository that `git archive` can pack; Python maps
      # the version to pkgver.
      - run: pacman -Syu --noconfirm --needed git just namcap python

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the dependencies of the PKGBUILD
        shell: bash
        run: |
          source packaging/aur/rudo-tui/PKGBUILD
          pacman -S --noconfirm --needed "${depends[@]}" "${makedepends[@]}"

      # makepkg refuses to run as root, and the tests of failed deletes need file permissions
      # that root ignores.
      - name: just packaging-aur
        run: |
          useradd --create-home builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c 'just packaging-aur'

      - run: scripts/package-smoke.sh target/packaging/aur/rudo-tui-[0-9]*.pkg.tar.zst

  deb-rpm:
    name: .deb and .rpm for ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          target: ${{ matrix.target }}

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: just,cargo-deb@3.8.0,cargo-generate-rpm@0.21.1

      # The binary that the release packs, from the musl archive that dist builds
      - run: cargo build --locked --profile dist --target ${{ matrix.target }}

      - run: just linux-packages ${{ matrix.target }} target/distrib

      # Debian, Fedora and openSUSE Tumbleweed of the runner's architecture
      - run: just package-smoke target/distrib

  version-order:
    name: pre-release versions sort before the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: just

      # dpkg, rpm and vercmp in containers of Debian, Fedora and Arch Linux
      - run: just package-version-order

  nix:
    name: nix flake check and nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0

      # Builds the package, which runs the tests
      - run: nix flake check --print-build-logs

      - run: nix run . -- --version

      - run: nix develop --command just --version
