name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: just check and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the toolchain and components pinned in rust-toolchain.toml and caches the
      # cargo build with Swatinem/rust-cache.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: just,cargo-deny,cargo-llvm-cov

      - run: just check

      - run: just smoke

      - name: Coverage
        # `shell: bash` adds `-o pipefail`, so a failing `just cov` fails the step despite `tee`.
        shell: bash
        run: |
          {
            echo '## Coverage'
            echo '```'
            just cov --summary-only | tee /dev/stderr
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  platforms:
    name: lint and test on ${{ matrix.os }}
    # While the repository is private, macOS minutes count ten times and Windows minutes twice,
    # so these jobs only run when started by hand and on pushes to main. Once the repository is
    # public, remove this condition to run them on every push and pull request.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # .gitattributes keeps the byte-exact fixtures and snapshots intact despite the
      # `core.autocrlf=true` of the Windows runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: just

      - run: just lint

      # Runs even after failed lints, and `--no-fail-fast` runs every test binary after a
      # failing one, so that one run reports every failure of the platform.
      - if: ${{ !cancelled() }}
        run: just test --no-fail-fast

      # The smoke test needs a pseudo-terminal, which Windows does not offer to Python: ConPTY
      # would need a third-party package, so docs/QA.md checks the Windows terminal by hand.
      - if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: just smoke

  msi:
    name: build, install and uninstall the msi
    # Same condition as the platforms job. The release builds the msi on windows-2022 (see
    # `dist plan`), whose image has the WiX Toolset v3 that dist needs; this job uses the same
    # runner so that it tests the same build.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      # The installer of the dist version in dist-workspace.toml, as release.yml installs it
      - run: irm https://github.com/axodotdev/cargo-dist/releases/download/v0.34.0/cargo-dist-installer.ps1 | iex

      # Builds the zip and the msi into target/distrib, as the release job does
      - run: dist build --artifacts=local --target=x86_64-pc-windows-msvc

      - name: Install the msi
        run: |
          $msi = (Resolve-Path target/distrib/rudo-tui-x86_64-pc-windows-msvc.msi).Path
          $process = Start-Process msiexec.exe -Wait -PassThru `
            -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'msi-install.log'
          if ($process.ExitCode -ne 0) {
            Get-Content msi-install.log -Tail 100
            throw "msiexec /i failed with exit code $($process.ExitCode)"
          }

      # The steps of a job inherit the PATH of the runner, so the PATH that a new shell of the
      # user gets is read from the registry, where the msi wrote it.
      - name: Run rudo through PATH and check the Installed apps entry
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' `
            + [Environment]::GetEnvironmentVariable('Path', 'User')
          $command = (Get-Command rudo).Source
          $expected = Join-Path $env:ProgramFiles 'rudo-tui\bin\rudo.exe'
          if ($command -ne $expected) { throw "rudo resolves to $command, not $expected" }
          rudo --version
          if ($LASTEXITCODE -ne 0) { throw "rudo --version failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $env:ProgramFiles 'rudo-tui\LICENSE'))) {
            throw 'the msi did not install LICENSE'
          }
          $entry = Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' |
            Where-Object DisplayName -eq 'rudo-tui'
          $entry | Format-List DisplayName, DisplayVersion, Publisher, HelpLink, InstallLocation
          if ($entry.Publisher -ne 'Altrabeth') { throw 'the Installed apps entry has no publisher' }

      - name: Uninstall the msi
        run: |
          $msi = (Resolve-Path target/distrib/rudo-tui-x86_64-pc-windows-msvc.msi).Path
          $process = Start-Process msiexec.exe -Wait -PassThru `
            -ArgumentList '/x', "`"$msi`"", '/qn', '/l*v', 'msi-uninstall.log'
          if ($process.ExitCode -ne 0) {
            Get-Content msi-uninstall.log -Tail 100
            throw "msiexec /x failed with exit code $($process.ExitCode)"
          }
          if (Test-Path (Join-Path $env:ProgramFiles 'rudo-tui')) {
            throw 'the uninstall left the install folder behind'
          }
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          if ($machinePath -like '*rudo-tui*') { throw 'the uninstall left rudo-tui in PATH' }

  freebsd:
    name: test on FreeBSD
    # Same condition as the platforms job: a VM job takes several times as long as a native one.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tests run as an unprivileged user, because root ignores the file permissions that
      # the tests of failed deletes rely on. Only the tests run here; coverage stays on Linux.
      - name: Test in a FreeBSD virtual machine
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          # notify watches with inotify when built natively on 14.5 or later and with kqueue
          # otherwise, so 14.4 tests the kqueue watcher that a cross-compiled binary uses on
          # every release.
          release: "14.4"
          copyback: false
          prepare: |
            pkg install -y curl
            pw useradd -n tester -m -s /bin/sh
            chown -R tester "$GITHUB_WORKSPACE"
          # rustup installs the toolchain and components pinned in rust-toolchain.toml.
          run: |
            su -l tester -c "
              set -eu
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain none
              . \"\$HOME/.cargo/env\"
              cd '$GITHUB_WORKSPACE'
              rustup toolchain install
              cargo test --all-features
            "

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner's Docker builds with BuildKit, which the Dockerfile needs.
      - run: docker build -t rudo-tui:smoke .

      - run: scripts/docker-smoke.sh rudo-tui:smoke
