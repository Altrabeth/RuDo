[package]
name = "rudo-tui"
version = "1.0.0"
edition = "2024"
rust-version = "1.100.0"
description = "A keyboard-driven terminal UI for todo lists stored as Markdown files"
license = "GPL-3.0-or-later"
repository = "https://github.com/Altrabeth/RuDo"
readme = "README.md"
keywords = ["todo", "tui", "markdown", "obsidian", "vim"]
categories = ["command-line-utilities"]
include = ["/src/**/*.rs", "/assets/", "/README.md", "/LICENSE", "/CHANGELOG.md"]

# The name `rudo` on crates.io belongs to another project; the command and the library keep it
[lib]
name = "rudo"

[[bin]]
name = "rudo"
path = "src/main.rs"

# `cargo binstall rudo-tui` downloads the archives of the GitHub release that dist builds
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

# The Windows archive holds its files without a folder
[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"

# `just linux-packages` packs the static musl binary of the `dist` profile into a .deb and an
# .rpm; name, version, description and license come from [package]. docs/RELEASING.md explains it.
[package.metadata.deb]
maintainer = "Altrabeth <Altrabeth@users.noreply.github.com>"
section = "utils"
priority = "optional"
# The binary is static, so it depends on nothing
depends = ""
# Other programs called rudo would install /usr/bin/rudo too
conflicts = "rudo"
extended-description = "The workspace is a folder, every Markdown file is a list and every checkbox a task, so the same tasks can be edited in RuDo and in Obsidian. The command is rudo."
assets = [
    ["target/release/rudo", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/rudo-tui/", "644"],
    ["CHANGELOG.md", "usr/share/doc/rudo-tui/", "644"],
    ["LICENSE", "usr/share/doc/rudo-tui/", "644"],
]

[package.metadata.generate-rpm]
# The binary is static, so it requires nothing
auto-req = "no"
conflicts = { rudo = "*" }
assets = [
    { source = "target/release/rudo", dest = "/usr/bin/rudo", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/rudo-tui/README.md", mode = "644", doc = true },
    { source = "CHANGELOG.md", dest = "/usr/share/doc/rudo-tui/CHANGELOG.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/rudo-tui/LICENSE", mode = "644" },
]

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
jiff = { version = "1.0.2", default-features = false, features = ["serde", "std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
notify-debouncer-full = { version = "0.8.0", default-features = false, features = ["macos_fsevent"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rayon = "1.12.0"
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde-saphyr = { version = "2.2.0", default-features = false, features = ["deserialize"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
shell-words = "1.1.1"
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
tempfile = { version = "3.27.0", default-features = false }
thiserror = "2.0.21"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "env-filter"] }
unicode-segmentation = { version = "1.13.3", default-features = false }

# Static musl binaries often run on systems without `/usr/share/zoneinfo`, such as containers;
# the bundled copy of the time zone database keeps "today" local there. jiff prefers the system
# copy when there is one.
[target.'cfg(target_env = "musl")'.dependencies]
jiff = { version = "1.0.2", default-features = false, features = ["tzdb-bundle-always"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[dev-dependencies]
insta = { version = "1.49.0", default-features = false }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
rstest = { version = "0.29.0", default-features = false }

[target."cfg(windows)".dependencies]
known-folders = "1.4.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
