[workspace]
members = ["cargo:."]

# Configuration of dist (https://axodotdev.github.io/cargo-dist), which generates
# .github/workflows/release.yml. Run `dist generate` after changing it; `dist plan` shows what a
# release builds. docs/RELEASING.md describes the release procedure.
[dist]
# The dist version that CI uses (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
ci = "github"
installers = ["shell", "powershell", "homebrew"]
# FreeBSD is not a dist target; the custom job below builds its archive
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
install-path = "CARGO_HOME"
hosting = "github"
install-updater = false
# The formula `rudo-tui` goes to this tap; the secret HOMEBREW_TAP_TOKEN may write to it
tap = "Altrabeth/homebrew-tap"
# .github/workflows/publish-docker.yml pushes the image to ghcr.io/altrabeth/rudo-tui
publish-jobs = ["homebrew", "./publish-docker"]
github-custom-job-permissions = { "publish-docker" = { contents = "read", packages = "write" } }
# .github/workflows/build-freebsd.yml, build-vendor-tarball.yml and build-linux-packages.yml
# (.deb, .rpm and Arch packages), whose files and checksums join the release
global-artifacts-jobs = ["./build-freebsd", "./build-vendor-tarball", "./build-linux-packages"]

# Pins the actions of the generated workflow to the commits of these releases, as in ci.yml
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
