name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: just check and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the toolchain and components pinned in rust-toolchain.toml and caches the
      # cargo build with Swatinem/rust-cache.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: just,cargo-deny,cargo-llvm-cov

      - run: just check

      - name: Coverage
        # `shell: bash` adds `-o pipefail`, so a failing `just cov` fails the step despite `tee`.
        shell: bash
        run: |
          {
            echo '## Coverage'
            echo '```'
            just cov --summary-only | tee /dev/stderr
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
