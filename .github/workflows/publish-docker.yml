name: Publish Docker image

# release.yml calls this workflow as a custom publish job (`publish-jobs` in dist-workspace.toml)
# once the GitHub release exists; dist skips it for pre-releases, so `latest` always names the
# newest stable release. `github-custom-job-permissions` grants the caller `packages: write`.
on:
  workflow_call:
    inputs:
      plan:
        description: the dist manifest of the plan job, whose tag names the version
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: push ghcr.io/altrabeth/rudo-tui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Tags with the version and `latest`; labels and annotations carry source, version and
      # license. GitHub reports the license as GPL-3.0, so it is named exactly here.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/altrabeth/rudo-tui
          tags: |
            type=semver,pattern={{version}},value=${{ fromJson(inputs.plan).announcement_tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=RuDo
            org.opencontainers.image.licenses=GPL-3.0-or-later
          annotations: |
            org.opencontainers.image.title=RuDo
            org.opencontainers.image.licenses=GPL-3.0-or-later

      # The image of the runner's platform is checked first, so that a broken image is never
      # pushed; the push below reuses its build cache.
      - name: Build the image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: rudo-tui:smoke

      - run: scripts/docker-smoke.sh rudo-tui:smoke

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile cross-compiles in a build stage on the runner's platform, so the arm64
      # image needs no emulation.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
