[package]
name = "rudo"
version = "1.0.0"
edition = "2024"
rust-version = "1.100.0"
description = "A keyboard-driven terminal UI for todo lists stored as Markdown files"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
jiff = { version = "1.0.2", default-features = false, features = ["serde", "std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
notify-debouncer-full = { version = "0.8.0", default-features = false, features = ["macos_fsevent"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rayon = "1.12.0"
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde-saphyr = { version = "2.2.0", default-features = false, features = ["deserialize"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
shell-words = "1.1.1"
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
tempfile = { version = "3.27.0", default-features = false }
thiserror = "2.0.21"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "env-filter"] }
unicode-segmentation = { version = "1.13.3", default-features = false }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[dev-dependencies]
insta = { version = "1.49.0", default-features = false }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
rstest = { version = "0.29.0", default-features = false }
