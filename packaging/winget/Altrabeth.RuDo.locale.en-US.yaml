ShortDescription: A keyboard-driven terminal UI for todo lists stored as Markdown files
Description: |-
  RuDo is a keyboard-driven terminal UI for todo lists stored as plain Markdown files. The
  workspace is a folder, every Markdown file is a list and every checkbox a task, so the same
  tasks can be edited in RuDo and in Obsidian. Navigation and editing use vim keybindings.
